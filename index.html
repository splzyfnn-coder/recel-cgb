<style>
  :root{--bg:#120d09;--card:#1d1510;--line:#3a2a1c;--txt:#f1e6d0;--mut:#9c8a70;--acc:#d9a63a;--ok:#4ade80;--bad:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% -10%,#2b1c10,var(--bg) 60%) fixed;color:var(--txt);font:15px/1.4 system-ui,Segoe UI,sans-serif}
  header{background:linear-gradient(180deg,#2b1c10,#150f0a);border-bottom:2px solid var(--acc)}
  .hero{max-width:920px;margin:0 auto;padding:16px 16px 0;display:flex;align-items:flex-end;gap:18px}
  .hero .logo{height:130px;width:130px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);box-shadow:0 0 30px #d9a63a55;margin-bottom:12px}
  .hero .perso{height:150px;margin-left:auto;object-fit:contain;filter:drop-shadow(0 4px 10px #000a)}
  .ttl{padding-bottom:22px}
  h1{margin:0;font-size:34px;color:var(--acc);letter-spacing:3px;line-height:1;font-weight:800;text-shadow:0 2px 12px #d9a63a44}
  .ttl small{display:block;color:var(--mut);font-size:12px;letter-spacing:4px;margin-top:6px}
  .bar{position:sticky;top:0;z-index:5;background:#0d0906ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--acc);display:flex;gap:10px;justify-content:center;padding:8px 16px}
  .stat{display:flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 18px;min-width:90px}
  .stat b{font-size:17px;color:var(--txt)}
  .stat span{font-size:10px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
  .stat.net b{color:var(--ok)}
  .stat[hidden]{display:none}
  .row.has{background:#d9a63a1c;box-shadow:inset 3px 0 var(--acc)}
  .row.has .tot{color:var(--acc)}
  .rate{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
  .rate input{width:60px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
  section.closed .row,section.closed .add{display:none}
  section h2 .chev{transition:.2s;font-size:12px}
  section.closed .chev{transform:rotate(-90deg)}
  section h2{cursor:pointer;user-select:none}
  .hrow{display:grid;grid-template-columns:130px 1fr 110px 110px 30px;gap:8px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .hrow .d{color:var(--mut)}.hrow .s{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .n{text-align:right;color:var(--ok)}.hrow .g{text-align:right;font-weight:600;color:var(--acc)}
  section.hist{border-left-color:var(--ok)}
  .cnt{color:var(--mut);font-size:11px;letter-spacing:0;font-weight:400;text-transform:none}
  section{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
  .stat.big{border-color:var(--acc);background:#2b1c10}
  .stat.big b{color:var(--acc);font-size:21px}
  main{max-width:920px;margin:0 auto;padding:16px;display:grid;gap:16px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button,input{font:inherit;color:var(--txt)}
  button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.pri{background:var(--acc);color:#1a1208;border-color:var(--acc);font-weight:600}
  button.ico{padding:2px 7px;border:0;background:none;color:var(--mut)}
  button.ico:hover{color:var(--acc)}
  button.ico.del:hover{color:var(--bad)}
  input[type=search]{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  label.chk{color:var(--mut);display:flex;gap:6px;align-items:center;font-size:13px}
  section{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px #0006}
  section h2{margin:0;padding:12px 14px;font-size:15px;letter-spacing:2px;text-transform:uppercase;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#33220f,#1d1510)}
  section h2 .t{margin-left:auto;color:var(--acc);font-size:17px;letter-spacing:0}
  .row:nth-of-type(even){background:#ffffff06}
  .row:hover{background:#d9a63a12}
  .qty input:focus{outline:1px solid var(--acc)}
  .row{display:grid;grid-template-columns:1fr 100px 125px 100px 56px;gap:8px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line)}
  .row.off{opacity:.45}
  .name{cursor:pointer}
  .tag{font-size:11px;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:0 5px;margin-left:6px}
  .price{color:var(--mut);text-align:right;cursor:pointer;border-radius:4px}
  .price:hover{color:var(--txt);background:#ffffff10}
  .price input{width:100%;background:#000;border:1px solid var(--acc);border-radius:4px;padding:2px 4px;text-align:right}
  .qty{display:flex;align-items:center;gap:3px}
  .qty button{padding:2px 8px}
  .qty input{width:52px;background:#0c0805;border:1px solid var(--line);border-radius:6px;padding:4px;text-align:center}
  .tot{text-align:right;font-weight:600}
  .tot.z{color:var(--mut);font-weight:400}
  .acts{display:flex;justify-content:flex-end}
  .add{padding:8px 14px;text-align:left}
  .add button{border-style:dashed;color:var(--mut);font-size:13px}
  .empty{padding:14px;color:var(--mut);text-align:center}
  @media(max-width:600px){.hrow{grid-template-columns:1fr 90px 30px}.hrow .s,.hrow .n{display:none}.row{grid-template-columns:1fr 85px 56px}.row .qty{grid-column:1/3}.row .tot{grid-column:1/3;text-align:left}.row .name{grid-column:1/3}.hero .logo{height:90px;width:90px}.hero .perso{height:110px}h1{font-size:24px}.stat{min-width:0;padding:4px 10px}}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#111;padding:8px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none}
  #toast.on{opacity:1}
</style>
</head>

<div class="bar">
    <div class="stat"><b id="nItems">0</b><span>objets</span></div>
    <div class="stat"><b id="nCats">0</b><span>catégories</span></div>
    <div class="stat net" id="netBox" hidden><b id="net">0 $</b><span id="netLbl">NET</span></div>
    <div class="stat big"><b id="grand">0 $</b><span>TOTAL GÉNÉRAL</span></div>
</div>
<main>
  <div class="tools">
    <label class="rate">Commission <input type="number" id="rate" min="0" max="100" step="1" value="0">%</label>
    <input type="search" id="q" placeholder="Rechercher un objet…">
    <label class="chk"><input type="checkbox" id="showOff"> afficher « ya plus »</label>
    <button class="pri" id="sell">✔ Valider la vente</button>
    <button id="addCat">+ Catégorie</button>
    <button id="copy">Copier le récap</button>
    <button id="csv">Export CSV</button>
    <button id="fold">Tout replier</button>
    <button id="reset">Quantités à 0</button>
    <button id="save" title="Télécharger une sauvegarde">Sauvegarder</button>
    <button id="load" title="Charger une sauvegarde">Charger</button>
    <input type="file" id="file" accept=".json" hidden>
    <button id="restore" title="Remet les catégories et prix de départ">Réinitialiser tout</button>
  </div>
  <div id="app"></div>
</main>
<div id="toast"></div>
<script>
const DEFAULT=[
 ["ART",[["Œuf antique",112000,1],["Œuf Napoléon",135000,1],["Vase antique",110000,1],["Pogo or",95000,1],["Panthère saphir",65000,1]]],
 ["PEINTURES",[["Peinture ancienne 1819",65000],["Peinture ancienne 1856",45000],["Peinture ancienne 1964",40000],["Peinture ancienne 1968",30000]]],
 ["BIJOUX",[["Lingot",11000],["Diamant",7500],["Saphir",5000],["Rubis",7000],["Émeraude",6000],["Diamant précieux",65000],["Montre en or",900],["Montre gousset",900],["Collier perle",1400],["Collier saphir",30000]]],
 ["CONTREBANDE",[["Alcool",50],["Cigarettes",50]]]
];
const KEY="recel-cgb-v2";
const uid=()=>Math.random().toString(36).slice(2,9);
const fresh=()=>({qty:{},history:[],collapsed:{},rate:0,cats:DEFAULT.map(([n,it])=>({id:uid(),name:n,items:it.map(([name,price,off])=>({id:uid(),name,price,off:!!off}))}))});
let st;
try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!st||!st.cats)st=fresh();
st.collapsed=st.collapsed||{};st.history=st.history||[];st.rate=st.rate||0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const fmt=n=>n.toLocaleString("fr-FR")+" $";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const qty=id=>st.qty[id]||0;
const upd=()=>{save();render()};
const findCat=id=>st.cats.find(c=>c.id===id);

function render(){
  const q=$("#q").value.toLowerCase(), showOff=$("#showOff").checked;
  let grand=0, html="";
  if(!st.cats.length)html='<div class="empty">Aucune catégorie. Clique sur « + Catégorie ».</div>';
  st.cats.forEach(cat=>{
    let total=0, rows="", pieces=0;
    cat.items.forEach(it=>{
      const n=qty(it.id); total+=it.price*n; pieces+=n;
      if((it.off&&!showOff&&!n)||(q&&!it.name.toLowerCase().includes(q)))return;
      rows+=`<div class="row${it.off?" off":""}${n?" has":""}" data-c="${cat.id}" data-i="${it.id}">
        <div class="name" data-a="rename-item" title="Renommer">${esc(it.name)}${it.off?'<span class="tag">ya plus</span>':""}</div>
        <div class="price" data-a="price" title="Modifier le prix">${fmt(it.price)}</div>
        <div class="qty"><button data-a="dec">−</button><input type="number" min="0" value="${n}" data-a="qty"><button data-a="inc">+</button></div>
        <div class="tot ${n?"":"z"}">${fmt(it.price*n)}</div>
        <div class="acts"><button class="ico" data-a="off" title="Marquer dispo / « ya plus »">⏻</button><button class="ico del" data-a="del-item" title="Supprimer">✕</button></div>
      </div>`;
    });
    grand+=total;
    html+=`<section data-c="${cat.id}" class="${st.collapsed[cat.id]?"closed":""}"><h2 data-a="toggle"><span class="chev">▼</span> ${esc(cat.name)}<span class="cnt">${pieces?pieces+" pièce"+(pieces>1?"s":""):""}</span>
      <button class="ico" data-a="up" title="Monter">▲</button><button class="ico" data-a="down" title="Descendre">▼</button>
      <button class="ico" data-a="rename-cat" title="Renommer la catégorie">✎</button>
      <button class="ico del" data-a="del-cat" title="Supprimer la catégorie">✕</button>
      <span class="t">${fmt(total)}</span></h2>${rows}
      <div class="add"><button data-a="add-item">+ Ajouter un objet</button></div></section>`;
  });
  const H=st.history, hTot=H.reduce((a,h)=>a+h.total,0), hNet=H.reduce((a,h)=>a+h.net,0);
  html+=`<section class="hist ${st.collapsed.__h?"closed":""}"><h2 data-a="toggle-hist"><span class="chev">▼</span> Historique des ventes<span class="cnt">${H.length} vente${H.length>1?"s":""}</span>
    <button class="ico del" data-a="clear-hist" title="Vider l'historique">🗑</button><span class="t">${fmt(hTot)}</span></h2>`+
    (H.length?H.slice().reverse().map(h=>`<div class="hrow" data-h="${h.id}"><span class="d">${new Date(h.date).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span><span class="s">${esc(h.lines.map(l=>l[0]+" x"+l[2]).join(", "))}</span><span class="n">${h.rate?"net "+fmt(h.net):""}</span><span class="g">${fmt(h.total)}</span><button class="ico del" data-a="del-sale">✕</button></div>`).join("")+`<div class="hrow"><span></span><span class="s">Cumul net</span><span class="n">${fmt(hNet)}</span><span class="g">${fmt(hTot)}</span><span></span></div>`:'<div class="empty">Aucune vente validée.</div>')+`</section>`;
  $("#app").innerHTML=html;
  $("#grand").textContent=fmt(grand);
  const r=Math.min(100,Math.max(0,st.rate||0));$("#netBox").hidden=!r;$("#net").textContent=fmt(Math.round(grand*(1-r/100)));$("#netLbl").textContent="NET (-"+r+"%)";
  $("#nCats").textContent=st.cats.length;
  $("#nItems").textContent=st.cats.reduce((a,c)=>a+c.items.length,0);
}

$("#app").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b)return;
  const a=b.dataset.a, sec=b.closest("section"), row=b.closest(".row");
  if(a==="toggle-hist"){if(e.target.closest("button")&&e.target.closest("button").dataset.a!=="toggle-hist")return;st.collapsed.__h=!st.collapsed.__h;upd();return}
  if(a==="clear-hist"){if(confirm("Vider tout l'historique ?")){st.history=[];upd()}return}
  if(a==="del-sale"){st.history=st.history.filter(h=>h.id!==b.closest("[data-h]").dataset.h);upd();return}
  const cat=sec&&findCat(sec.dataset.c), it=row&&cat&&cat.items.find(x=>x.id===row.dataset.i);
  if(a==="up"||a==="down"){const i=st.cats.indexOf(cat),j=i+(a==="up"?-1:1);if(j>=0&&j<st.cats.length){[st.cats[i],st.cats[j]]=[st.cats[j],st.cats[i]];upd()}return}
  if(a==="toggle"){if(e.target.closest("button"))return;st.collapsed[cat.id]=!st.collapsed[cat.id];upd();return}
  if(a==="inc"||a==="dec"){st.qty[it.id]=Math.max(0,qty(it.id)+(a==="inc"?1:-1));upd()}
  else if(a==="price"){
    b.innerHTML=`<input type="number" value="${it.price}">`;
    const i=b.firstChild;i.focus();i.select();
    i.onblur=()=>{it.price=Math.max(0,parseFloat(i.value)||0);upd()};
    i.onkeydown=ev=>{if(ev.key==="Enter")i.blur()};
  }
  else if(a==="rename-item"){const n=prompt("Nom de l'objet :",it.name);if(n&&n.trim()){it.name=n.trim();upd()}}
  else if(a==="off"){it.off=!it.off;upd()}
  else if(a==="del-item"){if(confirm(`Supprimer « ${it.name} » ?`)){cat.items=cat.items.filter(x=>x!==it);delete st.qty[it.id];upd()}}
  else if(a==="rename-cat"){const n=prompt("Nom de la catégorie :",cat.name);if(n&&n.trim()){cat.name=n.trim();upd()}}
  else if(a==="del-cat"){if(confirm(`Supprimer la catégorie « ${cat.name} » et tous ses objets ?`)){cat.items.forEach(x=>delete st.qty[x.id]);st.cats=st.cats.filter(c=>c!==cat);upd()}}
  else if(a==="add-item"){
    const name=prompt("Nom du nouvel objet :"); if(!name||!name.trim())return;
    const p=parseFloat((prompt("Prix :","0")||"0").replace(",","."))||0;
    cat.items.push({id:uid(),name:name.trim(),price:p,off:false});upd();
  }
});
$("#app").addEventListener("change",e=>{
  if(e.target.dataset.a!=="qty")return;
  st.qty[e.target.closest(".row").dataset.i]=Math.max(0,parseInt(e.target.value)||0);upd();
});
$("#addCat").onclick=()=>{const n=prompt("Nom de la nouvelle catégorie :");if(n&&n.trim()){st.cats.push({id:uid(),name:n.trim(),items:[]});upd()}};

function lines(){
  const out=[];let grand=0;
  st.cats.forEach(c=>{
    const l=[];let t=0;
    c.items.forEach(i=>{const n=qty(i.id);if(n){const s=i.price*n;t+=s;l.push([i.name,i.price,n,s])}});
    if(l.length)out.push({cat:c.name,l,t}); grand+=t;
  });
  return {out,grand};
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1500)}
$("#copy").onclick=()=>{
  const {out,grand}=lines();
  let s="📦 RECEL CGB\n";
  out.forEach(c=>{s+=`\n${c.cat}\n`;c.l.forEach(x=>s+=`- ${x[0]} x${x[2]} = ${fmt(x[3])}\n`);s+=`Total ${c.cat.toLowerCase()} : ${fmt(c.t)}\n`});
  s+=`\nTOTAL GÉNÉRAL : ${fmt(grand)}`;
  navigator.clipboard.writeText(s).then(()=>toast("Récap copié ✔"),()=>toast("Copie impossible"));
};
$("#csv").onclick=()=>{
  const {out,grand}=lines();
  let s="Catégorie;Objet;Prix;Quantité;Total\n";
  out.forEach(c=>c.l.forEach(x=>s+=`${c.cat};${x[0]};${x[1]};${x[2]};${x[3]}\n`));
  s+=`TOTAL GÉNÉRAL;;;;${grand}\n`;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+s],{type:"text/csv"}));
  a.download="recel-cgb.csv";a.click();
};
$("#reset").onclick=()=>{if(confirm("Remettre toutes les quantités à 0 ?")){st.qty={};upd()}};
$("#restore").onclick=()=>{if(confirm("Tout remettre comme au départ (catégories, objets, prix, quantités) ?")){st=fresh();upd()}};
$("#rate").value=st.rate;
$("#rate").oninput=e=>{st.rate=parseFloat(e.target.value)||0;upd2()};
function upd2(){save();render()}
$("#save").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,1)],{type:"application/json"}));a.download="recel-cgb-sauvegarde.json";a.click()};
$("#load").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(s=>{try{const d=JSON.parse(s);if(!d.cats)throw 0;st=Object.assign({qty:{},collapsed:{},rate:0},d);$("#rate").value=st.rate;upd();toast("Sauvegarde chargée ✔")}catch(_){toast("Fichier invalide")}});e.target.value=""};
$("#sell").onclick=()=>{
  const {out,grand}=lines(); if(!grand&&!out.length)return toast("Aucune quantité saisie");
  const r=Math.min(100,Math.max(0,st.rate||0));
  st.history.push({id:uid(),date:Date.now(),total:grand,net:Math.round(grand*(1-r/100)),rate:r,lines:out.flatMap(c=>c.l)});
  st.qty={};upd();toast("Vente enregistrée ✔");
};
$("#fold").onclick=()=>{const all=st.cats.every(c=>st.collapsed[c.id]);st.cats.forEach(c=>st.collapsed[c.id]=!all);upd();$("#fold").textContent=all?"Tout replier":"Tout déplier"};
$("#q").oninput=render; $("#showOff").onchange=render;
render();
</script>
</body>
</html>
